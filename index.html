<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuck Edwards</title>
<style>
  :root {
    --ink: #1c1f1e;
    --paper: #f7f5f0;
    --line: #d8d3c6;
    --accent: #2f5d50;
    --muted: #6b6a63;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    line-height: 1.6;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 8rem 1.5rem 6rem;
  }

  .mark {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2rem;
  }

  h1 {
    font-size: 2.75rem;
    font-weight: 400;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }

  .tagline {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.05rem;
    color: var(--muted);
    margin: 0 0 3rem;
  }

  p {
    font-size: 1.1rem;
    margin: 0 0 1.5rem;
  }

  .rule {
    border: none;
    border-top: 1px solid var(--line);
    margin: 3rem 0;
  }

  .links {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .links a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 2px;
    font-size: 0.95rem;
  }

  .links a:hover {
    color: var(--accent);
  }

  footer {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4rem;
  }

  @media (max-width: 480px) {
    .wrap { padding: 5rem 1.25rem 4rem; }
    h1 { font-size: 2.1rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Chuck Edwards</div>
    <h1>Hello.</h1>
    <p class="tagline">This site is under construction &mdash; more soon.</p>

    <p>
      I'm putting this page together as a home base. Check back shortly,
      or reach out in the meantime.
    </p>

    <hr class="rule">

    <div class="links">
      <a href="mailto:you@example.com">Email</a>
      <a href="https://www.linkedin.com/in/">LinkedIn</a>
      <a href="https://github.com/">GitHub</a>
    </div>

    <footer>&copy; 2026 Chuck Edwards</footer>
  </div>
</body>
</html>
